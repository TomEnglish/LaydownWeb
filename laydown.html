<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laydown Area - Site Layout Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <nav>
        <a href="index.html">Full Site Map</a>
    </nav>
    <div id="map"></div>
    <div class="info-panel">
        <h4>Laydown Area</h4>
        <div class="legend-item">
            <div class="legend-color" style="background-color: rgba(255, 0, 0, 0.3);"></div>
            <span>Laydown Area</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: rgba(255, 140, 0, 0.5);"></div>
            <span>Conexes (40m)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: rgba(165, 42, 42, 0.3);"></div>
            <span>Crane Area</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: rgba(0, 128, 128, 0.3);"></div>
            <span>Bayonne Laydown</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: rgba(255, 255, 0, 0.7);"></div>
            <span>Gate (A-West)</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: rgba(241, 36, 203, 0.7);"></div>
            <span>Gate (East)</span>
        </div>
        <div class="coordinates">
            <strong>Center:</strong><br>
            35.2936°N, 101.6030°W<br>
            <small>Near Amarillo, TX</small>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="laydown.js"></script>
</body>
</html>
